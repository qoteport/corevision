# Alembic config. The database URL comes from app.config (CV_DATA_DIR), not from this file.
# Run from the backend/ folder:
#   ../.venv/Scripts/alembic upgrade head
#   ../.venv/Scripts/alembic revision -m "add something"
# The server also runs `upgrade head` automatically at startup.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
